<!DOCTYPE html>
<html lang ="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Travel Bucket List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">  
    <script src="https://kit.fontawesome.com/881ab060ba.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class ="text-center mt-4">
        <i class="me-2 fa-solid fa-plane-departure"></i>
        My Travel Bucket List
    </h1>
    <p class ="text-center">Keep track of the places I want to explore and the adventures I want to have!</p>
    <div class="container mt-5">
        <h2 class="mb-3"> Destination Wishlist </h2>
    <div class="row g-4">
        <!-- Bootstrap card Seoul -->
        <div class="col-12 col-md-6 col-lg-4">   
            <div class="card h-100">
                <img class="card-img-top" src="images/Seoul.jpg" alt="Card image">
                <div class="card-body">
                <h4 class="card-title">Seoul, South Korea</h4>
                <p class="card-text">Travel notes</p>
                <span class="badge text-bg-info">Want to Visit</span>
                </div>
            </div> 
        </div>
        <!-- bootsrap card Busan -->
        <div class="col-12 col-md-6 col-lg-4">   
            <div class="card h-100">
                <img class="card-img-top" src="images/Busan.jpg" alt="Card image">
                <div class="card-body">
                <h4 class="card-title">Busan, South Korea</h4>
                <p class="card-text">Travel notes</p>
                <span class="badge text-bg-info">Want to Visit</span>
                </div>
            </div> 
        </div>
        <!-- bootsrap card Jeju -->
        <div class="col-12 col-md-6 col-lg-4">   
            <div class="card h-100">
                <img class="card-img-top" src="images/Jeju.jpg" alt="Card image">
                <div class="card-body">
                <h4 class="card-title">Jeju Island, South Korea</h4>
                <p class="card-text">Travel notes</p>
                <span class="badge text-bg-info">Want to Visit</span>
                </div>
            </div> 
        </div>
    </div>
    </div>
</body>
</html>
